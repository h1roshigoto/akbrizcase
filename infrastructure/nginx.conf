worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Do not log request URLs, query strings, bodies or credentials.
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;

        location = /readyz {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
        }

        location = /healthz {
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Staff cookies are HTTPS-only; enable compose.https.yml for access.
        location = /admin { return 404; }
        location ^~ /admin/ { return 404; }

        location /api/ {
            # Preserve /api/v1; the backend owns the API prefix.
            proxy_pass http://api:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /files/ { return 404; }
        # Private document storage never falls through to the SPA.
        location = /documents { return 404; }
        location ^~ /documents/ { return 404; }
        location = /images { return 404; }
        location ^~ /images/ { return 404; }
        location ~ /\. { return 404; }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
