worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;
    limit_req_zone $binary_remote_addr zone=login_limit:1m rate=5r/m;
    limit_req_status 429;
    # No log messages containing request lines, IPs, headers or credentials.
    limit_req_log_level error;
    map $uri $limit_retry_after {
        default 1;
        ~^/(api/v1/)?admin/auth/login/?$ 12;
    }
    map $request_id $safe_request_id {
        "~^(?<a>.{8})(?<b>.{4})(?<c>.{4})(?<d>.{4})(?<e>.{12})$" $a-$b-$c-$d-$e;
    }
    # Do not log request URLs, query strings, bodies or credentials.
    access_log off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        error_page 429 = @rate_limited;

        location @rate_limited {
            default_type application/json;
            add_header Retry-After $limit_retry_after always;
            add_header Cache-Control no-store always;
            add_header X-Request-ID $safe_request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests","details":{}},"request_id":"$safe_request_id"}';
        }

        location = /readyz {
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Akbriz-Client-IP $remote_addr;
            proxy_set_header X-Akbriz-Scheme $scheme;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
        }

        location = /healthz {
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Akbriz-Client-IP $remote_addr;
            proxy_set_header X-Akbriz-Scheme $scheme;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
        }

        # Staff cookies are HTTPS-only; enable compose.https.yml for access.
        location = /admin { return 404; }
        location ^~ /admin/ { return 404; }

        location /api/ {
            limit_req zone=api_limit burst=119 nodelay;
            # Preserve /api/v1; the backend owns the API prefix.
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Akbriz-Client-IP $remote_addr;
            proxy_set_header X-Akbriz-Scheme $scheme;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
        }

        location = /files { return 404; }
        location ^~ /files/ { return 404; }
        # Private document storage never falls through to the SPA.
        location = /documents { return 404; }
        location ^~ /documents/ { return 404; }
        location = /images { return 404; }
        location ^~ /images/ { return 404; }
        location ~ /\. { return 404; }

        location / {
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
            try_files $uri $uri/ /index.html;
        }
    }
    server {
        listen 8443 ssl;
        ssl_certificate /etc/nginx/tls/localhost.crt;
        ssl_certificate_key /etc/nginx/tls/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        error_page 429 = @rate_limited;

        location @rate_limited {
            default_type application/json;
            add_header Retry-After $limit_retry_after always;
            add_header Cache-Control no-store always;
            add_header X-Request-ID $safe_request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many requests","details":{}},"request_id":"$safe_request_id"}';
        }

        location = /readyz {
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Akbriz-Client-IP $remote_addr;
            proxy_set_header X-Akbriz-Scheme $scheme;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
        }

        location = /healthz {
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Akbriz-Client-IP $remote_addr;
            proxy_set_header X-Akbriz-Scheme $scheme;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
        }

        location = /admin/auth/login {
            limit_req zone=api_limit burst=119 nodelay;
            limit_req zone=login_limit burst=4 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Akbriz-Client-IP $remote_addr;
            proxy_set_header X-Akbriz-Scheme $scheme;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
        }

        location = /admin { return 308 /admin/; }
        location ^~ /admin/ {
            limit_req zone=api_limit burst=119 nodelay;
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Akbriz-Client-IP $remote_addr;
            proxy_set_header X-Akbriz-Scheme $scheme;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_redirect ~^http://[^/]+(/.*)$ $1;
        }

        location /api/ {
            limit_req zone=api_limit burst=119 nodelay;
            # Preserve /api/v1; the backend owns the API prefix.
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Akbriz-Client-IP $remote_addr;
            proxy_set_header X-Akbriz-Scheme $scheme;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
        }

        location = /files { return 404; }
        location ^~ /files/ { return 404; }
        # Private document storage never falls through to the SPA.
        location = /documents { return 404; }
        location ^~ /documents/ { return 404; }
        location = /images { return 404; }
        location ^~ /images/ { return 404; }
        location ~ /\. { return 404; }

        location / {
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy same-origin always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
