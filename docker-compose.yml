name: akbrizcase

x-backend: &backend
  image: akbrizcase-backend:mvp-003
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m,mode=1777
  volumes:
    - app_files:/var/lib/akbrizcase/files
  environment: &backend-environment
    APP_FILES_DIR: /var/lib/akbrizcase/files
    DB_PASSWORD_FILE: /run/secrets/runtime_password
  secrets: [runtime_password]
  stop_grace_period: 10s
  depends_on:
    postgres:
      condition: service_healthy

services:
  nginx:
    image: akbrizcase-frontend:mvp-055
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    networks: [ingress, web]
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101,mode=1770
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 10s

  api:
    <<: *backend
    environment:
      <<: *backend-environment
      APP_ENV: ${APP_ENV:-production}
      PRIVACY_CONFIG_FILE: /run/privacy/approved.json
      STAFF_CSRF_SECRET_FILE: /run/secrets/staff_csrf_secret
      ORDER_HMAC_SECRET_FILE: /run/secrets/order_hmac_secret
      IP_HMAC_SECRET_FILE: /run/secrets/ip_hmac_secret
      TRUSTED_PROXY_HOST: nginx
      STAFF_TRUSTED_ORIGINS: ${STAFF_TRUSTED_ORIGINS:-https://localhost:8443}
    volumes:
      - app_files:/var/lib/akbrizcase/files
      - ${PRIVACY_CONFIG_DIR:-./.privacy}:/run/privacy:ro
    secrets: [runtime_password, staff_csrf_secret, order_hmac_secret, ip_hmac_secret]
    build:
      context: ./backend
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --no-proxy-headers, --no-access-log]
    networks: [web, data]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    <<: *backend
    pull_policy: never
    command: [python, -m, app.worker]
    networks: [data]

  migrate:
    image: akbrizcase-backend:mvp-003
    profiles: [tools]
    command: [python, -m, app.core.db_migrate]
    networks: [data]
    environment:
      MIGRATION_DB_PASSWORD_FILE: /run/secrets/migrator_password
    secrets: [migrator_password]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    image: akbrizcase-backend:mvp-003
    profiles: [tools]
    entrypoint: [python, -m, app.modules.catalog.seed]
    networks: [data]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_PASSWORD_FILE: /run/secrets/runtime_password
    secrets: [runtime_password]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy

  kb:
    <<: *backend
    profiles: [tools]
    entrypoint: [python, -m, app.modules.kb.cli]
    networks: [data]
    stdin_open: true
    tty: true

  privacy:
    image: akbrizcase-backend:mvp-003
    profiles: [tools]
    entrypoint: [python, -m, app.modules.orders.privacy_cli]
    networks: [data]
    environment:
      APP_ENV: ${APP_ENV:-production}
      MIGRATION_DB_PASSWORD_FILE: /run/secrets/migrator_password
    secrets: [migrator_password]
    volumes:
      - ${PRIVACY_CONFIG_DIR:-./.privacy}:/run/privacy:ro
    stdin_open: true
    tty: true
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  postgres:
    image: postgres:16.13-bookworm
    command: [postgres, -c, log_error_verbosity=terse, -c, log_min_error_statement=panic]
    environment:
      POSTGRES_DB: akbrizcase
      POSTGRES_USER: akbrizcase_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password, migrator_password, runtime_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/provision.sh:/docker-entrypoint-initdb.d/010-provision.sh:ro
    networks: [data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U akbrizcase_owner -d akbrizcase"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s

networks:
  ingress:
  web:
    internal: true
  data:
    internal: true

volumes:
  app_files:
  postgres_data:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE to a protected password file (see README.md)}
  migrator_password:
    file: ${MIGRATOR_PASSWORD_FILE:?Set MIGRATOR_PASSWORD_FILE to a protected password file}
  runtime_password:
    file: ${RUNTIME_PASSWORD_FILE:?Set RUNTIME_PASSWORD_FILE to a protected password file}

  staff_csrf_secret:
    file: ${STAFF_CSRF_SECRET_FILE:-./.secrets/staff_csrf_secret}
  order_hmac_secret:
    file: ${ORDER_HMAC_SECRET_FILE:-./.secrets/order_hmac_secret}
  ip_hmac_secret:
    file: ${IP_HMAC_SECRET_FILE:-./.secrets/ip_hmac_secret}
