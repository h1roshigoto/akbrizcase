# Explicit operator-selected, immutable, authenticated CVD release (not Git).
services:
  api:
    volumes:
      - type: bind
        source: ${CLAMAV_RELEASE_DIR:?Select an operator-verified immutable CVD release}
        target: /var/lib/akbrizcase/clamav
        read_only: true
  worker:
    volumes:
      - type: bind
        source: ${CLAMAV_RELEASE_DIR:?Select an operator-verified immutable CVD release}
        target: /var/lib/akbrizcase/clamav
        read_only: true
