[project]
name = "akbrizcase-backend"
version = "0.1.0"
description = "Minimal FastAPI backend for akbrizcase"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.18.4",
    "argon2-cffi==25.1.0",
    "fastapi==0.162.0",
    "itsdangerous==2.2.0",
    "psycopg[binary]==3.3.3",
    "pydantic==2.14.1",
    "sqladmin==0.21.0",
    "sqlalchemy==2.0.46",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false
required-version = "==0.12.23"

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-config --strict-markers -m 'not integration'"
markers = ["integration: isolated PostgreSQL 16 integration checks"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[dependency-groups]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.2",
]
