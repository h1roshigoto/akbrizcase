name: Skeleton CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Each main push has a unique group; only older commits of the same PR cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  operator:
    name: Synthetic operator handover rehearsal
    env:
      MVP049_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Operator and pilot content paths, locked FTS, then encrypted clean restore
        run: make mvp049-rehearsal
      - name: Recover interrupted labelled integration stacks, preserving volumes
        if: always()
        run: make integration-reset
      # Only closed stage codes and aggregate evidence; no child logs/artifacts.
  release:
    name: Synthetic staging release rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Verify exact source and release failure guards
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_EXPECTED_HEAD"
          make release-test
      - name: Immutable images, TLS, migration failure, isolation and compatible rollback
        run: make release-rehearsal
      # No runtime logs, secrets, private paths or database/image archives uploaded.
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.12.23
      - name: Prepare inventory output directory
        run: echo "CI_INVENTORY_DIR=$RUNNER_TEMP/tech001-inventory" >> "$GITHUB_ENV"
      - name: Verify toolchain
        run: |
          python -c 'import platform; assert platform.python_version() == "3.12.14"'
          test "$(uv --version | cut -d ' ' -f 2)" = '0.12.23'
      - name: Install locked dependencies
        run: make backend-sync
      - name: Offline pilot content guards
        run: make mvp049-guards
      - name: Pytest
        run: |
          set -o pipefail
          make backend-test | tee "$RUNNER_TEMP/tech001-backend.log"
      - name: Record backend test identities after successful execution
        run: python3 scripts/ci_inventory.py backend "$RUNNER_TEMP/tech001-backend.log"
      - name: Ruff check and format
        run: make backend-lint
      - name: Mypy strict
        run: make backend-types
      - name: Upload test identities only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-identities
          path: ${{ env.CI_INVENTORY_DIR }}/*.json
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@11.9.0 --strict-ssl=true --no-audit --no-fund
      - name: Verify toolchain
        run: |
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.9.0'
      - name: Install locked dependencies
        run: make frontend-sync
      - name: Typecheck
        run: make frontend-typecheck
      - name: Frontend UI tests
        run: npm --prefix frontend test -- --reporter=verbose
      - name: Build
        run: make frontend-build

  browser-e2e:
    name: Linked browser E2E acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MVP046_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Prepare disposable synthetic secret
        run: |
          cp .env.example .env
          make init-secrets
      - name: Validate Compose configuration
        run: make config
      - name: Synthetic stack safety guards
        run: make acceptance-guards
      - name: Build backend and frontend images
        run: make build
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install browser tooling
        run: |
          npm install --global npm@11.9.0 --strict-ssl=true --no-audit --no-fund
          make frontend-sync
          # Avoid long Azure mirror stalls consuming the browser test budget.
          # Preserve signed Ubuntu packages and TLS verification.
          for apt_source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$apt_source_file" ]; then
              sudo sed -i \
                -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "$apt_source_file"
            fi
          done
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/80-akbrizcase-network >/dev/null
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
      - name: Install pinned Chromium headless shell and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps --only-shell chromium
      - name: Two independent fresh linked synthetic stacks on exact PR HEAD
        run: |
          test "$(git rev-parse HEAD)" = "$MVP046_EXPECTED_HEAD"
          make local-tls
          python3 scripts/ci_suites.py mvp046:first -- make mvp046-browser-e2e
          python3 scripts/ci_suites.py mvp046:second -- make mvp046-browser-e2e
      # Closed test IDs/counts only. Never upload HAR, screenshots, bodies or traces.
      - name: Remove temporary secrets
        if: always()
        run: rm -rf -- .secrets .certs .env

  compose:
    name: Compose build and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MVP014_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MVP015_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MVP016_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MVP018_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Prepare disposable synthetic secret
        run: |
          cp .env.example .env
          make init-secrets
      - name: Validate Compose configuration
        run: make config
      - name: Synthetic stack safety guards
        run: make acceptance-guards
      - name: Build backend and frontend images
        run: make build
      - name: Container smoke and MVP-017 isolated SMTP (two separate stacks)
        run: make compose-smokes
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install browser tooling
        run: |
          npm install --global npm@11.9.0 --strict-ssl=true --no-audit --no-fund
          make frontend-sync
          # Avoid long Azure mirror stalls consuming the browser test budget.
          # Preserve signed Ubuntu packages and TLS verification.
          for apt_source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$apt_source_file" ]; then
              sudo sed -i \
                -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "$apt_source_file"
            fi
          done
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/80-akbrizcase-network >/dev/null
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
      - name: Install pinned Chromium headless shell and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps --only-shell chromium
      - name: Live PostgreSQL catalog browser acceptance
        run: python3 scripts/ci_suites.py compose:catalog-browser -- make catalog-browser-smoke
      - name: Public chat through React, Nginx, FastAPI and PostgreSQL
        run: python3 scripts/ci_suites.py compose:chat-browser -- make chat-browser-smoke
      - name: Trusted HTTPS browser authentication and CSRF
        run: |
          make local-tls
          python3 scripts/ci_suites.py compose:https-auth -- make https-smoke
      - name: Independent support handoff, session deletion and expiry replay
        run: python3 scripts/ci_suites.py compose:support-browser -- make support-browser-smoke
      - name: Privacy retirement/config loss replay and readable policy over trusted HTTPS
        run: python3 scripts/ci_suites.py compose:privacy-browser -- make privacy-browser-smoke
      - name: MVP-014 browser E2E, PostgreSQL invariants and Compose persistence
        run: python3 scripts/ci_suites.py compose:vertical -- make vertical-smoke
      - name: MVP-015 manager status, conflict, immutable snapshots and original replay
        run: python3 scripts/ci_suites.py compose:status -- make status-browser-smoke
      - name: MVP-016 admin catalog forms, revision, XSS and immutable snapshots
        run: python3 scripts/ci_suites.py compose:catalog-admin -- make catalog-admin-browser-smoke
      - name: MVP-018 failed notification, protected browser retry and real SMTP
        run: python3 scripts/ci_suites.py compose:notification-retry -- make notification-retry-browser-smoke
      - name: HTTP security, proxy spoofing and limits over trusted HTTPS
        run: python3 scripts/ci_suites.py compose:http-security -- make http-security-smoke
      - name: Remove temporary secret
        if: always()
        run: rm -rf -- .secrets .certs .env

  database:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-24.04
    # MVP-045 adds 65 real publication/HTTP/CLI cases. The measured full run
    # passed at the old 15-minute boundary, before inventory could upload.
    # Domain, scanner/parser and lock deadlines remain unchanged.
    timeout-minutes: 20
    env:
      COMMERCIAL_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      KB_ACCEPTANCE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Prepare disposable synthetic secret
        run: |
          echo "CI_INVENTORY_DIR=$RUNNER_TEMP/tech001-inventory" >> "$GITHUB_ENV"
          cp .env.example .env
          make init-secrets
      - name: Full PG16 suites including locked MVP-047 corpus, ACL/publication and real files
        run: make integration-ci
      - name: Recover interrupted test stack
        if: always()
        run: make integration-reset
      - name: Upload test identities only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-file-test-identities
          path: ${{ env.CI_INVENTORY_DIR }}/*.json
          if-no-files-found: error
          retention-days: 7

  backup:
    name: Encrypted PG16 backup and clean restore
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Actual age archive, new PG16 and files, deletion completeness and replay
        run: make backup-rehearsal
      # No archives, keys, database dumps, manifests, runtime or pytest logs uploaded.

  load-smoke:
    name: Bounded synthetic load and recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MVP048_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Exact source and deterministic evidence guards
        run: |
          test "$(git rev-parse HEAD)" = "$MVP048_EXPECTED_HEAD"
          make mvp048-guards
          make mvp048-image-guards
      - name: Build full disposable synthetic profile
        run: |
          cp .env.example .env
          make init-secrets local-tls
          docker pull python:3.12.14-alpine
      - name: Real TLS, 200 client pool, 30 network sources, committed HTTP and recovery
        run: make mvp048-smoke MVP048_ARGS="--report-dir $RUNNER_TEMP/mvp048-evidence"
      - name: Remove ephemeral runtime inputs
        if: always()
        run: rm -rf -- .secrets .certs .env
      # No private ledger, child logs, contacts, tokens, mail or SourceRef uploads.
      # Shared-runner p95 is synthetic evidence; TARGET_LOAD remains BLOCKED.
