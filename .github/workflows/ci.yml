name: Skeleton CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Each main push has a unique group; only older commits of the same PR cancel.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Install pinned uv
        run: python -m pip install --disable-pip-version-check uv==0.12.23
      - name: Prepare inventory output directory
        run: echo "CI_INVENTORY_DIR=$RUNNER_TEMP/tech001-inventory" >> "$GITHUB_ENV"
      - name: Verify toolchain
        run: |
          python -c 'import platform; assert platform.python_version() == "3.12.14"'
          test "$(uv --version | cut -d ' ' -f 2)" = '0.12.23'
      - name: Install locked dependencies
        run: make backend-sync
      - name: Pytest
        run: |
          set -o pipefail
          make backend-test | tee "$RUNNER_TEMP/tech001-backend.log"
      - name: Record backend test identities after successful execution
        run: python3 scripts/ci_inventory.py backend "$RUNNER_TEMP/tech001-backend.log"
      - name: Ruff check and format
        run: make backend-lint
      - name: Mypy strict
        run: make backend-types
      - name: Upload test identities only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-test-identities
          path: ${{ env.CI_INVENTORY_DIR }}/*.json
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global npm@11.9.0 --strict-ssl=true --no-audit --no-fund
      - name: Verify toolchain
        run: |
          test "$(node --version)" = 'v24.19.0'
          test "$(npm --version)" = '11.9.0'
      - name: Install locked dependencies
        run: make frontend-sync
      - name: Typecheck
        run: make frontend-typecheck
      - name: Frontend UI tests
        run: npm --prefix frontend test -- --reporter=verbose
      - name: Build
        run: make frontend-build

  compose:
    name: Compose build and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MVP014_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MVP015_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MVP016_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MVP018_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Prepare disposable synthetic secret
        run: |
          cp .env.example .env
          make init-secrets
      - name: Validate Compose configuration
        run: make config
      - name: Synthetic stack safety guards
        run: make acceptance-guards
      - name: Build backend and frontend images
        run: make build
      - name: Container smoke and MVP-017 isolated SMTP (two separate stacks)
        run: make compose-smokes
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install browser tooling
        run: |
          npm install --global npm@11.9.0 --strict-ssl=true --no-audit --no-fund
          make frontend-sync
          # Avoid long Azure mirror stalls consuming the browser test budget.
          # Preserve signed Ubuntu packages and TLS verification.
          for apt_source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            if [ -f "$apt_source_file" ]; then
              sudo sed -i \
                -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "$apt_source_file"
            fi
          done
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "20";' 'Acquire::https::Timeout "20";' \
            | sudo tee /etc/apt/apt.conf.d/80-akbrizcase-network >/dev/null
          sudo apt-get update
          sudo apt-get install -y libnss3-tools
      - name: Install pinned Chromium headless shell and system dependencies
        working-directory: frontend
        run: npx playwright install --with-deps --only-shell chromium
      - name: Live PostgreSQL catalog browser acceptance
        run: python3 scripts/ci_suites.py compose:catalog-browser -- make catalog-browser-smoke
      - name: Public chat through React, Nginx, FastAPI and PostgreSQL
        run: python3 scripts/ci_suites.py compose:chat-browser -- make chat-browser-smoke
      - name: Trusted HTTPS browser authentication and CSRF
        run: |
          make local-tls
          python3 scripts/ci_suites.py compose:https-auth -- make https-smoke
      - name: Independent support handoff, session deletion and expiry replay
        run: python3 scripts/ci_suites.py compose:support-browser -- make support-browser-smoke
      - name: Privacy retirement/config loss replay and readable policy over trusted HTTPS
        run: python3 scripts/ci_suites.py compose:privacy-browser -- make privacy-browser-smoke
      - name: MVP-014 browser E2E, PostgreSQL invariants and Compose persistence
        run: python3 scripts/ci_suites.py compose:vertical -- make vertical-smoke
      - name: MVP-015 manager status, conflict, immutable snapshots and original replay
        run: python3 scripts/ci_suites.py compose:status -- make status-browser-smoke
      - name: MVP-016 admin catalog forms, revision, XSS and immutable snapshots
        run: python3 scripts/ci_suites.py compose:catalog-admin -- make catalog-admin-browser-smoke
      - name: MVP-018 failed notification, protected browser retry and real SMTP
        run: python3 scripts/ci_suites.py compose:notification-retry -- make notification-retry-browser-smoke
      - name: Remove temporary secret
        if: always()
        run: rm -rf -- .secrets .certs .env

  database:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.14'
      - name: Prepare disposable synthetic secret
        run: |
          echo "CI_INVENTORY_DIR=$RUNNER_TEMP/tech001-inventory" >> "$GITHUB_ENV"
          cp .env.example .env
          make init-secrets
      - name: All PostgreSQL suites and real ClamAV/sandbox (at most two stacks)
        run: make integration-ci
      - name: Recover interrupted test stack
        if: always()
        run: make integration-reset
      - name: Upload test identities only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-file-test-identities
          path: ${{ env.CI_INVENTORY_DIR }}/*.json
          if-no-files-found: error
          retention-days: 7
